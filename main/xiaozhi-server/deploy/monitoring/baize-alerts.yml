groups:
  - name: baize
    rules:
      - alert: BaizeAppDown
        expr: up{job="baize-app"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Baize metrics endpoint is unavailable"}
      - alert: BaizeHealthEndpointFailed
        expr: probe_success{job="blackbox-https"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Public Baize HTTPS health check failed"}
      - alert: BaizeDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Root filesystem has less than 15% free space"}
      - alert: BaizeCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 30 * 24 * 3600
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Baize HTTPS certificate expires within 30 days"}
      - alert: BaizeHttp5xxRateHigh
        expr: sum(rate(baize_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(baize_http_requests_total[5m])), 0.1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Baize HTTP 5xx rate exceeds 5%"}
      - alert: BaizeContentSafetyProviderSpike
        expr: increase(baize_content_safety_provider_errors_total[5m]) > 10
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Baize upstream content guard blocks or errors exceeded 10 in 5 minutes"}
      - alert: BaizeMobileCrashReported
        expr: increase(baize_app_crash_reports_total[10m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "A signed-in Baize mobile app reported a crash"}
      - alert: BaizeMobileApi5xxHigh
        expr: sum(increase(baize_app_api_reports_total{status_class="5xx"}[10m])) > 5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Mobile clients observed more than five API 5xx responses in ten minutes"}
      - alert: BaizeMobileApiP95Slow
        expr: histogram_quantile(0.95, sum by (le) (rate(baize_app_api_duration_seconds_bucket[10m]))) > 3
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Mobile-observed API p95 latency exceeds three seconds"}
      - alert: BaizeSqliteUnhealthy
        expr: baize_sqlite_healthy == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Baize SQLite health check is failing"}
      - alert: BaizeMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Baize server has less than 10% available memory"}
      - alert: BaizeSupportTicketBacklog
        expr: baize_open_support_tickets > 10
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "More than ten support tickets are waiting"}
