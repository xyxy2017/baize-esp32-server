[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = burningpowercat.com
root_url = https://burningpowercat.com/grafana/
serve_from_sub_path = true

[security]
admin_user = baize-admin
disable_initial_admin_creation = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
